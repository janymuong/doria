---
- name: Baseline for every lab host
  hosts: lab
  become: true
  roles:
    - common
    - node_exporter

- name: Office server
  hosts: servers
  become: true
  roles:
    - dnsmasq
    - backup

- name: Monitoring server
  hosts: monitoring
  become: true
  roles:
    - blackbox_exporter
    - alertmanager
    - prometheus
    - grafana

- name: Clients take their address from DHCP
  hosts: clients
  become: true
  roles:
    - dhcp_client
