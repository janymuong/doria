---
- name: Install node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure node exporter arguments
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: node_exporter)
      ARGS="--web.listen-address={{ node_exporter_listen }} --collector.textfile.directory={{ node_exporter_textfile_dir }}"
  notify: Restart node exporter

- name: Enable and start node exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
