modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      method: GET

  http_head_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      method: HEAD

  dns_a:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: deb.debian.org
      query_type: A
      valid_rcodes:
        - NOERROR
