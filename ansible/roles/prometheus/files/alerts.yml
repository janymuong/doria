groups:
  - name: reachability
    rules:
      - alert: HostUnreachable
        expr: probe_success{job="blackbox_icmp", host!~"gateway|internet"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} does not answer ping"

      - alert: GatewayUnreachable
        expr: probe_success{job="blackbox_icmp", host="gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The lab gateway does not answer ping"

      - alert: InternetUnreachable
        expr: probe_success{job="blackbox_icmp", host="internet"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "No ping reply from 1.1.1.1, the internet link may be down"

  - name: services
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The exporter on {{ $labels.host }} is not answering"

      - alert: ServiceDown
        expr: probe_success{job="blackbox_http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} does not answer on HTTP"

      - alert: LocalDnsDown
        expr: probe_success{job="blackbox_dns_local"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The local DNS server {{ $labels.instance }} is not answering"

      - alert: MirrorUnreachable
        expr: probe_success{job="blackbox_http_external"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The Debian mirror is not reachable, updates will fail"

  - name: capacity
    rules:
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }}: {{ $labels.mountpoint }} is {{ $value | printf "%.0f" }}% full'

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }} has {{ $value | printf "%.0f" }}% of its memory available'

  - name: backups
    rules:
      - alert: BackupFailed
        expr: doria_backup_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The last backup on {{ $labels.host }} failed"

      - alert: BackupStale
        expr: time() - doria_backup_last_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }}: no successful backup for {{ $value | humanizeDuration }}'

      - alert: RestoreTestFailed
        expr: doria_restore_test_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The last restore test on {{ $labels.host }} failed, the newest backup may not be usable"

      - alert: RestoreTestStale
        expr: time() - doria_restore_test_last_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }}: no passing restore test for {{ $value | humanizeDuration }}'

      - alert: BackupMetricsMissing
        expr: absent(doria_backup_success{host="srv"})
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "srv is not reporting backup metrics, the job may never have run"
